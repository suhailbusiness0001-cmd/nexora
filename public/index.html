<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="language" content="English">
    <meta name="geo.region" content="US, GB, CA, AU">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora | Premium All-in-One Downloader</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration:none; color:inherit;">NEXORA<span>.</span></a>
        </div>
        <div class="nav-links">
            <a href="guide.html">Guide</a>
            <a href="faq.html">FAQ</a>
            <button id="theme-btn" class="badge">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <section class="hero">
        <h1 class="gradient-text">Download Faster.</h1>
        <p style="color: var(--text-dim);">Premium video downloader for TikTok, YouTube, Instagram, and more.</p>
        
        <div class="downloader-container">
            <div class="input-wrapper">
                <input type="text" id="videoUrl" placeholder="Paste link here...">
                <button class="dl-btn" id="startDl">Download</button>
            </div>

            <div id="preview-container" style="display: none; margin-top: 25px; text-align: center; background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
                <h3 id="videoTitle" style="color: white; margin-bottom: 15px; font-size: 1.1rem; line-height: 1.4;">Processing Request...</h3>
                
                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                    <a id="hdDownloadBtn" href="#" target="_blank" style="padding: 14px 28px; background: #149777; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; display: none; box-shadow: 0 4px 15px rgba(20, 151, 119, 0.3); transition: all 0.3s ease;">Download File Now</a>
                </div>
            </div>
        </div>

        <div class="platforms">
            <span class="badge"><i class="fab fa-youtube"></i> YouTube</span>
            <span class="badge"><i class="fab fa-tiktok"></i> TikTok</span>
            <span class="badge"><i class="fab fa-instagram"></i> Instagram</span>
            <span class="badge"><i class="fab fa-twitter"></i> Twitter/X</span>
        </div>

        <div class="ad-placeholder">
            <span>Advertisement</span>
        </div>
    </section>

    <script src="js/handler.js"></script>
</body>
</html>
